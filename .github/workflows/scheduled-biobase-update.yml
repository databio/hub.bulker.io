name: Manual biobase update with Claude

# Manual fallback. Recurring biobase updates are scheduled in Jules.
# The complete procedure lives in automation/update-biobase.md.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  update-biobase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code to update biobase
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Follow automation/update-biobase.md completely.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(*),Read(*),Write(*),Edit(*),Glob(*),Grep(*)"'
          show_full_output: true
